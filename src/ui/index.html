<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src favecus:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Favecus Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="preview.js" defer></script>
  <script src="keybindings.js" defer></script>
  <script src="transport-model.js" defer></script>
  <script src="playlist-reader.js" defer></script>
  <script src="queue-follow.js" defer></script>
  <script src="queue-drag.js" defer></script>
  <script src="list-artwork.js" defer></script>
  <script src="library-tree.js" defer></script>
  <script src="home-view.js" defer></script>
  <script src="library-search.js" defer></script>
  <script src="tree-view.js" defer></script>
  <script src="parent-picker.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="titlebar"><div class="titlebar-safe"><img src="icon.png" alt=""><span>Favecus Player</span><button id="mini-player" type="button" title="ミニプレイヤーに切り替え" aria-label="ミニプレイヤーに切り替え"><svg aria-hidden="true"><use href="icons.svg#down"/></svg></button></div></div>
  <aside class="sidebar">
    <div class="side-label"><span>プレイリスト</span><button id="new-list" class="icon-button" title="新しいプレイリスト" aria-label="新しいプレイリスト">＋</button></div>
    <div class="all-playlists"><button id="all-lists" class="all-lists-label" type="button">ホーム <span id="all-count">0曲</span></button><button id="all-normal" class="icon-button" aria-label="ホームを順番に再生" title="すべてを順番に再生">▶</button><button id="all-shuffle" class="icon-button" aria-label="ホームをシャッフル再生" title="すべてをシャッフル再生">⤨</button></div>
    <div id="playlists" class="playlists"></div>
    <div class="sidebar-bottom">
      <div id="download-mini" class="download-mini hidden" role="status" aria-live="polite">
        <p id="download-mini-label"></p><progress id="download-mini-gauge" max="100" value="0" aria-label="保存の進捗"></progress>
        <small id="download-mini-detail"></small><button id="download-mini-cancel" class="button secondary" type="button">キャンセル</button>
      </div><button id="downloads-status" class="button secondary downloads-status" type="button">動画・音声の保存</button>
      <div class="version">Favecus Player <span id="version">0.7.3</span></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><span id="breadcrumb">マイライブラリ <b>/</b> Bilibili</span><button id="discord-status" class="connection"><span>⚙ 設定</span><span class="status-divider">·</span><span class="status-dot"></span><span id="discord-label">Discord 未設定</span></button></header>
    <div id="home-search" class="home-search hidden"><label for="home-query">全登録曲を検索</label><input id="home-query" type="search" maxlength="200" placeholder="曲名・リスト名・動画ID・URLで検索" aria-label="全プレイリストの登録曲を検索" aria-controls="home"><button id="home-search-clear" class="button secondary" type="button" disabled>検索を解除</button></div>
    <section id="home" class="home hidden" aria-label="ホーム"></section>
    <div id="home-notice" class="hidden"></div>
    <section id="bili-heading" class="heading">
      <div><div class="eyebrow">プレイリスト</div><div class="title-line"><h1 id="list-title">お気に入り</h1><button id="list-menu" class="icon-button" aria-label="プレイリストの編集">•••</button><button id="new-child-list" class="icon-button" type="button" aria-label="このプレイリストの子を作成" title="このプレイリストの子を作成">＋</button></div><p><span id="entry-count">0 本</span><span class="separator">·</span>選んだ動画を、選んだ順番で。</p></div>
      <div class="heading-actions"><button id="browse-bilibili" class="button secondary" disabled title="設定・連携からBilibiliにログインしてください">bilibiliから検索して追加</button><button id="add-files" class="button secondary">ファイル追加</button><button id="add-existing" class="button secondary">既存のプレイリストから追加</button><button id="add-url" class="button primary">＋ URLから追加</button></div>
    </section>
    <div id="workspace" class="workspace">
    <section id="player-area" class="player-area">
      <div class="player-top"><span id="player-label">プレーヤー</span><div id="view-actions" class="hidden"><div class="mode-switch" role="group" aria-label="再生画面の表示"><button id="mode-song" type="button" aria-pressed="false" title="サムネイルと音声で再生">曲</button><button id="mode-video" type="button" aria-pressed="true" title="動画を表示して再生">動画</button></div><button id="page-mode" class="text-button">公式ページ表示</button><button id="reload" class="text-button" title="表示モードを保って再生画面を作り直します">再読み込み</button><button id="open-official" class="text-button">ブラウザーで開く ↗</button></div></div>
      <div id="player-slot" class="player-slot">
        <div id="thumbnail-panel" class="thumbnail-panel hidden"><img id="thumbnail-image" src="music.png" alt="再生中の曲のサムネイル"><strong id="thumbnail-title"></strong><p id="thumbnail-note"></p></div>
        <div id="empty-player" class="player-empty"><div class="orbit"><span>▶</span></div><h2 id="empty-title">好きな動画から、はじめよう。</h2><p id="empty-description">Bilibiliの動画URLや音楽ファイルを追加して、<br>あなただけの再生リストをつくれます。</p><button id="empty-add" class="button secondary">最初の動画を追加</button><span class="player-hint">公式サイトで再生 · Bilibiliの弾幕は初期オフ</span></div>
        <div id="loading" class="loading hidden"><span class="spinner"></span>プレイヤーを読み込んでいます</div>
      </div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </section>
    <section id="queue-section" class="queue-section">
      <div class="queue-toolbar"><div class="queue-title"><button id="playlist-up" class="icon-button hidden" type="button" aria-label="親プレイリストへ戻る" title="親プレイリストへ戻る">↑</button>再生リスト <span id="queue-count">0</span></div><div class="queue-tools"><input id="filter" type="search" placeholder="リスト内を検索" aria-label="リスト内を検索"><button id="sort-lists" class="button secondary" type="button">並べ替え</button><button id="shuffle-play" class="button shuffle-play-button" title="再生回数を考慮して、新しい順序でシャッフル再生">⤨ シャッフル再生</button><button id="play-all" class="button play-button">▶ 再生</button></div></div>
      <div id="entries" class="entries" tabindex="0" aria-label="再生リストの曲"></div>
      <div id="up-next" class="up-next hidden"><button id="up-next-toggle" class="up-next-toggle" type="button" aria-expanded="false" aria-controls="queue-timeline"><div class="up-next-heading"><span id="up-next-label">次に再生</span><span id="up-next-path"></span></div><strong id="up-next-title"></strong><span class="timeline-hint">履歴・再生予定を開く</span></button><div id="queue-timeline" class="queue-timeline hidden" tabindex="0" aria-label="再生履歴とこれからの曲"></div></div>
    </section>
    </div>
  </main>
  <footer class="transport"><div class="now-playing"><div id="now-icon" class="now-icon">♫</div><div class="now-copy"><div class="now-title-row"><strong id="now-title">再生していません</strong><button id="favorite" class="favorite-button hidden" type="button" aria-pressed="false" title="お気に入りにする" aria-label="お気に入りにする">♡</button></div><span id="now-artist">動画を選んで再生</span><button id="resume-last" class="resume-last hidden" type="button"></button></div><span id="now-saved" class="entry-type now-saved hidden" role="status" aria-live="polite"></span></div><div class="transport-controls">
    <button id="shuffle" class="icon-button" title="シャッフル" aria-label="シャッフル" aria-pressed="false">⤨</button>
    <button id="previous" class="icon-button" title="前の動画" aria-label="前の動画" disabled><svg aria-hidden="true"><use href="icons.svg#previous"/></svg></button>
    <button id="back-ten" class="icon-button skip-button" title="10秒戻す" aria-label="10秒戻す" disabled><svg aria-hidden="true"><use href="icons.svg#back-ten"/></svg></button>
    <button id="toggle" class="toggle-button" aria-label="再生・一時停止" disabled><svg aria-hidden="true"><use href="icons.svg#play"/></svg></button>
    <button id="forward-ten" class="icon-button skip-button" title="10秒進める" aria-label="10秒進める" disabled><svg aria-hidden="true"><use href="icons.svg#forward-ten"/></svg></button>
    <button id="next" class="icon-button" title="次の動画" aria-label="次の動画" disabled><svg aria-hidden="true"><use href="icons.svg#next"/></svg></button>
    <button id="repeat" class="icon-button" title="リピート オフ" aria-label="リピート オフ" aria-pressed="false">↻</button>
    <button id="sleep" class="icon-button" title="おやすみタイマー オフ（押すと15分）" aria-label="おやすみタイマー オフ（押すと15分）" aria-pressed="false">☾</button>
    <button id="stop" class="icon-button" title="停止" aria-label="停止" disabled><svg aria-hidden="true"><use href="icons.svg#stop"/></svg></button>
  </div><div class="progress-area"><span id="position">0:00</span><input id="progress" type="range" value="0" min="0" max="1" step="0.1" aria-label="再生位置" disabled><span id="duration">0:00</span></div><div class="transport-volume"><button id="mute" class="icon-button" type="button" aria-label="ミュート" title="ミュート"><svg aria-hidden="true"><use href="icons.svg#volume"/></svg></button><input id="transport-volume" type="range" min="0" max="100" step="1" value="100" aria-label="アプリの音量"><output id="transport-volume-value" for="transport-volume">100%</output></div></footer>
  <dialog id="modal" aria-labelledby="modal-title"><form id="modal-form"><div class="modal-heading"><button type="button" id="modal-back" class="button secondary hidden" aria-label="前の画面に戻る">← 戻る</button><h2 id="modal-title"></h2><button type="button" id="modal-close" class="icon-button" aria-label="閉じる">×</button></div><div id="modal-body"></div><p id="modal-notice" class="status-detail hidden" role="status" aria-live="polite"></p><div class="modal-footer"><button type="button" id="modal-cancel" class="button secondary">閉じる</button><span id="modal-actions" class="modal-actions"></span><button type="submit" id="modal-submit" class="button primary">保存</button></div></form></dialog>
</body>
</html>
